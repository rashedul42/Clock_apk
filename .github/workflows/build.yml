name: Build Android APK

# Runs on every push/PR to main, and can also be triggered manually from
# the Actions tab (workflow_dispatch) whenever you want a fresh build
# without pushing a commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Flutter's Android build needs a JDK; 17 matches current Android
      # Gradle Plugin / Flutter requirements.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Non-fatal: surfaces lint/type issues in the Actions log without
      # failing the build, since a red squiggle shouldn't block getting an
      # installable APK onto your phone.
      - name: Analyze (non-blocking)
        run: flutter analyze || true

      # Debug build: no signing config needed, installs directly via
      # "allow unknown apps" on a real device. Swap for
      # `flutter build apk --release` once you've set up your own
      # signing key (see android/app/build.gradle comments).
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clock-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
